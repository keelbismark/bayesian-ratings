<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Байесовское обновление для оценки рейтингов в прямом эфире</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0D1B2A;
      color: #E2E8F0;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .player-shadow {
      box-shadow: 0 0 50px rgba(78, 168, 222, 0.25), 0 25px 60px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 antialiased selection:bg-[#4EA8DE] selection:text-[#0D1B2A]">

  <!-- COMPACT HEADER -->
  <header class="w-full max-w-5xl text-center space-y-2 pt-2 pb-6">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#132238] border border-[#4EA8DE]/30 text-xs font-mono text-[#4EA8DE]">
      <span class="w-2 h-2 rounded-full bg-[#FF7B54] animate-pulse"></span>
      16:9 • 4K Motion Design • Байесовские сети
    </div>
    <h1 class="text-xl sm:text-3xl font-bold text-white tracking-tight">
      Байесовское обновление для оценки рейтингов в прямом эфире
    </h1>
  </header>

  <!-- MAIN VIDEO PLAYER -->
  <main class="w-full max-w-5xl flex flex-col items-center space-y-6">
    <div class="w-full aspect-video rounded-2xl overflow-hidden border border-[#4EA8DE]/40 bg-black player-shadow relative group">
      <video
        id="mainVideo"
        controls
        autoplay
        loop
        playsinline
        poster="scene1.png"
        class="w-full h-full object-contain bg-black"
      >
        <source src="video.mp4" type="video/mp4" />
        <source src="scene1_preview.mp4" type="video/mp4" />
        Ваш браузер не поддерживает встроенное видео.
      </video>
    </div>

    <!-- DOWNLOAD BUTTONS -->
    <div class="w-full flex flex-wrap items-center justify-center gap-4 pt-2">
      <!-- Download Video MP4 -->
      <a
        id="downloadVideoBtn"
        href="video.mp4"
        download="bayesian_ratings_video.mp4"
        class="inline-flex items-center gap-2.5 px-6 py-3.5 rounded-xl font-semibold text-sm bg-[#4EA8DE] text-[#0D1B2A] hover:bg-[#4EA8DE]/90 transition shadow-[0_0_25px_rgba(78,168,222,0.4)]"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Скачать видео (MP4)
      </a>

      <!-- Download Audio MP3 -->
      <a
        href="ambient.mp3"
        download="bayesian_ambient_soundtrack.mp3"
        class="inline-flex items-center gap-2 px-5 py-3.5 rounded-xl font-medium text-sm bg-[#132238] hover:bg-[#1B2E4B] border border-[#FF7B54]/40 text-[#FF7B54] transition"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z" />
        </svg>
        Скачать саундтрек (MP3)
      </a>

      <!-- Download 4K Frames -->
      <a
        href="scene1.png"
        download="scene1_4k.png"
        class="inline-flex items-center gap-2 px-5 py-3.5 rounded-xl font-medium text-sm bg-[#132238] hover:bg-[#1B2E4B] border border-white/15 text-slate-300 transition"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        Скачать 4K кадр (PNG)
      </a>
    </div>
  </main>

  <!-- FOOTER CREDITS -->
  <footer class="w-full max-w-5xl pt-8 pb-4 border-t border-white/10 text-center space-y-2 mt-8">
    <div class="text-xs font-mono uppercase tracking-wider text-slate-400">Над проектом работали</div>
    <div class="text-sm font-semibold text-white flex flex-wrap justify-center gap-4">
      <span>Голомидова Женя</span>
      <span class="text-[#4EA8DE]">•</span>
      <span>Селиванов Илья</span>
      <span class="text-[#4EA8DE]">•</span>
      <span>Константин Толов</span>
      <span class="text-[#4EA8DE]">•</span>
      <span>Фураев Никита</span>
    </div>
  </footer>

  <script>
    // Fallback if video.mp4 is still rendering
    const video = document.getElementById('mainVideo');
    video.onerror = function() {
      if (video.currentSrc.endsWith('video.mp4')) {
        video.src = 'scene1_preview.mp4';
        video.play();
      }
    };
  </script>
</body>
</html>
